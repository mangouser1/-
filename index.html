:7px 10px;border-radius:5px;cursor:pointer}.explorer-toolbar button:hover{background:var(--surface2)}.explorer-body{display:flex;height:calc(100% - 48px)}.explorer-nav{width:170px;background:var(--surface2);padding:12px 8px;border-right:1px solid var(--line)}.explorer-nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:transparent;border-radius:5px;padding:9px;font-size:12px;cursor:pointer}.explorer-nav button:hover{background:rgba(90,130,180,.12)}.explorer-files{flex:1;padding:20px;overflow:auto}.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:10px}.file-item{min-height:88px;border:1px solid transparent;border-radius:7px;background:transparent;padding:10px 5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;cursor:pointer;font-size:12px}.file-item:hover{background:var(--surface2);border-color:var(--line)}.file-item .file-icon{width:32px;height:32px;display:grid;place-items:center}.file-item .file-icon svg{width:28px;height:28px}.notepad{height:100%;display:flex;flex-direction:column}.notepad-toolbar{padding:7px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;font-size:12px}.notepad textarea{resize:none;border:0;outline:0;flex:1;padding:18px;font-family:Consolas,monospace;font-size:14px;background:var(--surface);color:var(--ink);user-select:text}.browser-page{padding:22px;background:var(--surface2);height:100%;overflow:auto}.browser-search{display:flex;gap:7px;margin:10px auto 30px;max-width:620px}.browser-search input{flex:1;border:1px solid var(--line);border-radius:7px;padding:11px 13px;background:var(--surface);user-select:text}.browser-card{max-width:620px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}.browser-links{display:flex;flex-wrap:wrap;gap:8px}.browser-links a{color:var(--accent);font-size:13px}.taskmgr-table{width:100%;border-collapse:collapse;font-size:12px}.taskmg #boot{position:fixed;inset:0;z-index:30000;background:#101b32;color:white;display:grid;place-items:center;transition:opacity .55s,visibility .55s}#boot.hide{opacity:0;visibility:hidden}.boot-inner{text-align:center;animation:bootPulse 1.3s ease-in-out infinite alternate}.boot-logo{width:74px;height:74px;border-radius:22px;background:linear-gradient(145deg,#8fc1ff,#3774cf);margin:0 auto 18px;display:grid;place-items:center;font-size:38px;box-shadow:0 12px 35px rgba(60,120,220,.35)}.boot-name{font-size:26px;font-weight:650;letter-spacing:.5px}.boot-sub{font-size:12px;opacity:.65;margin-top:8px}@keyframes bootPulse{to{transform:translateY(-4px);opacity:.85}}

body.dark{--panel-bg:rgba(34,39,49,.9);--surface:#252a34;--surface2:#1d222b;--ink:#f1f3f7;--muted:#aab2c0;--line:rgba(220,230,245,.13);color-scheme:dark}body.dark #taskbar{background:rgba(27,32,42,.84);border-color:rgba(255,255,255,.08)}body.dark .panel-search,body.dark .modal input{background:#1c212a;border-color:#465165}body.dark .quick-tile{background:rgba(60,68,82,.65)}body.dark .quick-tile.on{background:#29476f;border-color:#4e79b6}body.dark .app-window{border-color:rgba(255,255,255,.12)}body.dark .desktop-icon.selected{background:rgba(85,140,220,.4)}

/* Windows 11-inspired monochrome taskbar and power states. */
#taskbar{color:var(--ink);background:rgba(248,248,248,.9);border-top:1px solid rgba(0,0,0,.10)}
.task-btn,.tray-button{color:#242424}
.task-btn svg,.tray-button svg{width:22px;height:22px;display:block;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
#start-btn svg{fill:currentColor;stroke:none;width:23px;height:23px}
#weather-task svg{width:21px;height:21px}
.task-btn.running:after{background:#777}
.task-btn.current:after{background:#222}
.task-app-glyph{display:grid;place-items:center;width:23px;height:23px;color:#252525}
.task-app-glyph svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
#boot{background:#050505;color:#f7f7f7}
.boot-logo{width:74px;height:74px;border-radius:0;background:transparent;box-shadow:none;margin:0 auto 18px;display:grid;place-items:center}
.boot-logo svg{width:58px;height:58px;fill:#f5f5f5}
.boot-inner{text-align:center;animation:bootPulse 1.3s ease-in-out infinite alternate}
#shutdown-screen{position:fixed;inset:0;z-index:40000;display:none;place-items:center;background:#050505;color:#f5f5f5;text-align:center}
#shutdown-screen.show{display:grid;animation:shutdownFade .45s ease-out}
@keyframes shutdownFade{from{opacity:0}to{opacity:1}}
.shutdown-content{display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px}
.shutdown-logo svg{width:54px;height:54px;fill:#f5f5f5}
.shutdown-title{font-size:17px;font-weight:600;letter-spacing:.02em}
.shutdown-sub{font-size:12px;color:#aaa}
#power-on-btn{margin-top:28px;padding:10px 18px;border:1px solid #666;border-radius:6px;background:#171717;color:#fff;cursor:pointer;font-size:13px}
#power-on-btn:hover{background:#292929;border-color:#aaa}
.power-options{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:18px 0 4px}
.power-option{padding:14px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--ink);cursor:pointer;text-align:left}
.power-option:hover{background:rgba(130,130,130,.14);border-color:#888}
.power-option strong{display:block;font-size:13px;margin-bottom:3px}
.power-option small{display:block;color:var(--muted);font-size:11px}

function getMangoBattleStoreHTML(){const bytes=Uint8Array.from(atob(MANGOBATTLE_HTML_B64),c=>c.charCodeAt(0));return new TextDecoder('utf-8').decode(bytes)}
function getMangoBattleStoreState(){const a=apps.find(x=>x.id===MANGOBATTLE_STORE_ID);if(!a)return 'install';return a.version===MANGOBATTLE_STORE_VERSION?'open':'update'}
async function installMangoBattleFromStore(){
 const old=apps.find(x=>x.id===MANGOBATTLE_STORE_ID);
 const record={...(old||{}),id:MANGOBATTLE_STORE_ID,title:'MangoBattle',icon:'gamepad',kind:'html',type:'html',version:MANGOBATTLE_STORE_VERSION,html:'',sourceUrl:MANGOBATTLE_LIVE_URL,sourceFileName:'MangoBattle.html（GitHub Pages 公開版）',addedAt:old?.addedAt||Date.now(),updatedAt:Date.now()};
 await dbPut(record);
 if(old)Object.assign(old,record);else apps.push(record);
 addAppIcon(record);renderStart();
 const explorer=windows.get('explorer');if(explorer)fillExplorer(explorer.area);
 const opened=windows.get(MANGOBATTLE_STORE_ID);const frame=opened?.area.querySelector('iframe');if(frame)setHtmlAppFrameSource(frame,record.html,MANGOBATTLE_STORE_ID,record.version);
 toast(old?'MangoBattleを更新しました':'MangoBattleをインストールしました','GitHub Pagesの公開版をMangoOSに登録しました。');
}
function downloadMangoBattleFromStore(){const blob=new Blob([getMangoBattleStoreHTML()],{type:'text/html;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='MangoBattle_v0.13.7.html';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('ダウンロード','MangoBattle_v0.13.7.html を保存します。')}

async function openDB(){
 if(MANGO_SERVER_MODE){const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw new Error('MangoOSローカル保存サーバーに接続できません');const state=await r.json();serverApps=Array.isArray(state.apps)?state.apps:[];serverKv=state.kv&&typeof state.kv==='object'?state.kv:{};return 'remote'}
 return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})

function fallbackApps(){if(MANGO_SERVER_MODE)return serverApps.slice();try{return JSON.parse(storage.getItem('mango-html-apps')||'[]')}catch{return []}}
function saveFallbackApps(list){if(MANGO_SERVER_MODE){serverApps=list.slice();return}storage.setItem('mango-html-apps',JSON.stringify(list))}
function dbAll(){if(db==='remote')return Promise.resolve(serverApps.slice());if(!db)return Promise.resolve(fallbackApps());return new Promise((resolve,reject)=>{const r=db.transaction(STORE,'readonly').objectStore(STORE).getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error)})}
function dbPut(v){if(db==='remote'){const list=serverApps.filter(a=>a.id!==v.id);list.push(v);serverApps=list;return fetch('/api/apps',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)}).then(r=>{if(!r.ok)throw new Error('アプリ保存に失敗しました')})}if(!db){const list=fallbackApps().filter(a=>a.id!==v.id);list.push(v);saveFallbackApps(list);return Promise.resolve()}return new Promise((resolve,reject)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(v);t.oncomplete=resolve;t.onerror=()=>reject(t.error)})}
function dbDelete(id){if(db==='remote'){serverApps=serverApps.filter(a=>a.id!==id);return fetch('/api/apps?id='+encodeURIComponent(id),{method:'DELETE'}).then(r=>{if(!r.ok)throw new Error('アプリ削除に失敗しました')})}if(!db){saveFallbackApps(fallbackApps().filter(a=>a.id!==id));return Promise.resolve()}return new Promise((resolve,reject)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).delete(id);t.oncomplete=resolve;t.onerror=()=>reject(t.error)})}

function setHtmlAppFrameSource(frame,html,appId,version=''){
 const savedApp=apps.find(x=>x.id===appId);
 const appKey=String(appId||'').toLowerCase();
 const hostedSource=savedApp?.sourceUrl||(appId===MANGOBATTLE_STORE_ID?MANGOBATTLE_LIVE_URL:'');
 if(hostedSource){
  try{
   const hosted=new URL(hostedSource);
   if(hosted.protocol!=='https:'||hosted.hostname!=='mangouser1.github.io'||hosted.pathname!=='/-/MangoBattle.html')throw new Error('許可されていないアプリ配布元です。');
   frame.dataset.mangoSource='github-pages-live';
   frame.src=hosted.href;
   return;
  }catch(err){console.warn('Hosted MangoBattle URL rejected',err);frame.srcdoc='<main style="font:14px sans-serif;padding:24px"><h2>MangoBattleを開けません</h2><p>公開URLを確認してください。</p></main>';return}
 }
 const isMangoBattle=appKey.includes('mangobattle')||/<meta\s+name=["']mangoos-app["']\s+content=["']mangobattle["']/i.test(html||'');
 if(isMangoBattle&&MANGO_SERVER_MODE){
  frame.src='/apps/'+encodeURIComponent(appId)+'?v='+encodeURIComponent(version||Date.now());
  return;
 }
 if(isMangoBattle&&['http:','https:'].includes(location.protocol)){
  // GitHub Pages: use the HTML saved in the installed Store app record.
  // This avoids a 404 when MangoBattle.html has not been uploaded separately.
  // The game includes an early origin normalizer which maps about:srcdoc to
  // the same-origin parent URL before Firebase Auth modules are imported.
  const embedded=String((typeof html==='string'&&html.trim())?html:getMangoBattleStoreHTML());
  if(embedded.trim() && /<meta\s+name=["']mangoos-app["']\s+content=["']mangobattle["']/i.test(embedded)){
   frame.dataset.mangoSource='store-embedded';
   frame.srcdoc=persistentFrameHTML(embedded,appId);
   return;
  }
  // Older manually-added shortcuts may not carry app HTML. Keep a direct-file
  // fallback for those, while the Store-installed app always uses its saved HTML.
  const gameUrl=new URL('./MangoBattle.html',location.href);
  gameUrl.searchParams.set('mangoosAppVersion',version||'0.13.6');
  frame.dataset.mangoSource='published-file';
  frame.src=gameUrl.href;
  return;
 }
 frame.dataset.mangoSource='srcdoc';
 frame.srcdoc=persistentFrameHTML(html,appId);
}
function persistentFrameHTML(html,appId){

 const id=JSON.stringify(String(appId));
 const bridge=`<script>(function(){try{var appId=${id};var data={};var read=new XMLHttpRequest();read.open('GET','/api/app-storage?id='+encodeURIComponent(appId),false);read.send();if(read.status===200)data=JSON.parse(read.responseText)||{};var save=function(){try{var x=new XMLHttpRequest();x.open('POST','/api/app-storage?id='+encodeURIComponent(appId),false);x.setRequestHeader('Content-Type','application/json');x.send(JSON.stringify(data));}catch(e){}};var api={get length(){return Object.keys(data).length},key:function(i){return Object.keys(data)[i]??null},getItem:function(k){k=String(k);return Object.prototype.hasOwnProperty.call(data,k)?String(data[k]):null},setItem:function(k,v){data[String(k)]=String(v);save()},removeItem:function(k){delete data[String(k)];save()},clear:function(){data={};save()}};Object.defineProperty(window,'localStorage',{configurable:true,value:api});}catch(e){console.warn('MangoOS app storage bridge unavailable',e)}})();<\/script>`;

const MANGOOS_BUILD_VERSION='1.27.0';
const MANGOOS_UPDATE_MANIFEST_URL='https://mangouser1.github.io/-/mangoos-update.json';
const MANGOOS_UPDATE_RAW_FALLBACK='https://raw.githubusercontent.com/mangouser1/-/main/mangoos-update.json';
let mangoosLastUpdateManifest=null;
function mangoosCompareVersions(a,b){const aa=String(a).split('.').map(x=>parseInt(x,10)||0),bb=String(b).split('.').map(x=>parseInt(x,10)||0);for(let i=0;i<Math.max(aa.length,bb.length);i++){const d=(aa[i]||0)-(bb[i]||0);if(d)return d}return 0}
function mangoosSetUpdateStatus(area,message,heading){const root=area||document;const status=$('#mangoos-update-status',root);const head=$('#mangoos-update-heading',root);const detail=$('#mangoos-update-detail',root);if(status)status.textContent=message;if(head&&heading)head.textContent=heading;if(detail&&message)detail.textContent=message}
async function mangoosFetchManifest(){
 const candidates=[MANGOOS_UPDATE_MANIFEST_URL,MANGOOS_UPDATE_RAW_FALLBACK];let lastError=null;
 for(const url of candidates){try{const response=await fetch(url+(url.includes('?')?'&':'?')+'_='+Date.now(),{cache:'no-store',mode:'cors',credentials:'omit'});if(!response.ok)throw new Error('HTTP '+response.status);const data=await response.json();if(!data||data.product!=='MangoOS'||!data.latestVersion||!data.htmlUrl)throw new Error('更新情報の形式が正しくありません。');const target=new URL(data.htmlUrl,url);if(!['mangouser1.github.io'].includes(target.hostname))throw new Error('更新ファイルの配布元が許可されていません。');data._manifestUrl=url;data._htmlUrl=target.href;return data}catch(err){lastError=err}}
 throw lastError||new Error('更新情報を取得できませんでした。')
}
async function mangoosSha256(buffer){if(!crypto?.subtle)throw new Error('この環境では更新ファイルの安全性を確認できません。HTTPSのGitHub Pagesで開いてください。');const digest=await crypto.subtle.digest('SHA-256',buffer);return [...new Uint8Array(digest)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function mangoosDownloadAndApply(manifest){
 const url=manifest._htmlUrl+(manifest._htmlUrl.includes('?')?'&':'?')+'_='+Date.now();
 const response=await fetch(url,{cache:'no-store',mode:'cors',credentials:'omit'});if(!response.ok)throw new Error('更新ファイルをダウンロードできませんでした（HTTP '+response.status+'）。');
 const buffer=await response.arrayBuffer();if(buffer.byteLength<50000||buffer.byteLength>12*1024*1024)throw new Error('更新HTMLのサイズが想定範囲外です。');
 const actual=await mangoosSha256(buffer);if(!manifest.sha256||actual.toLowerCase()!==String(manifest.sha256).toLowerCase())throw new Error('更新ファイルのSHA-256が一致しません。マニフェストとHTMLを同時に公開してください。');
 const text=new TextDecoder('utf-8',{fatal:true}).decode(buffer);const versionMatch=text.match(/<meta\s+name=["']mangoos-version["']\s+content=["']([^"']+)["']/i);if(!versionMatch||versionMatch[1]!==manifest.latestVersion||!/<html[\s>]/i.test(text)||!/<title[^>]*>\s*MangoOS/i.test(text))throw new Error('更新ファイルのバージョンまたはHTML形式が一致しません。');
 if(MANGO_SERVER_MODE){const saved=await fetch('/api/update-os',{method:'POST',headers:{'Content-Type':'text/html; charset=utf-8'},body:buffer,cache:'no-store'});const result=await saved.json().catch(()=>({}));if(!saved.ok||!result.ok)throw new Error(result.error||'この端末のMangoOSファイルを更新できませんでした。');toast('MangoOSの更新','v'+manifest.latestVersion+'を適用しました。再起動します。');setTimeout(()=>location.reload(),900);return}
 // For GitHub Pages or an HTML-only hosted session, replace the active document in-place.
 // This preserves the current origin, localStorage and IndexedDB while loading the new source.
 toast('MangoOSの更新','v'+manifest.latestVersion+'を適用しています。');document.open();document.write(text);document.close();
}
async function checkMangoOSUpdates(area,silent=false){
 const statusArea=area||document;const status=$('#mangoos-update-status',statusArea);const checkButton=$('[data-setting-action="check-update"]',statusArea);if(checkButton)checkButton.disabled=true;
 mangoosSetUpdateStatus(statusArea,'GitHub Pagesから更新情報を確認しています…','更新を確認しています');
 try{
  const manifest=await mangoosFetchManifest();mangoosLastUpdateManifest=manifest;const comparison=mangoosCompareVersions(manifest.latestVersion,MANGOOS_BUILD_VERSION);const checked=new Date().toLocaleString('ja-JP');
  if(comparison<=0){const msg='最新の状態です。現在 v'+MANGOOS_BUILD_VERSION+'（確認：'+checked+'）';mangoosSetUpdateStatus(statusArea,msg,'MangoOS は最新の状態です');if(!silent)toast('MangoOS Update','新しい更新プログラムはありません。');return}
  const notes=Array.isArray(manifest.releaseNotes)?manifest.releaseNotes.join('\n'):String(manifest.releaseNotes||'改善と不具合修正');
  mangoosSetUpdateStatus(statusArea,'新しいバージョン v'+manifest.latestVersion+' が見つかりました。','更新プログラムがあります');
  showModal(`<h2>MangoOS の更新</h2><p>新しいバージョン <strong>v${escapeHTML(manifest.latestVersion)}</strong> が見つかりました。</p><div class="settings-card" style="padding:13px;margin:12px 0"><strong>更新内容</strong><p style="white-space:pre-line;line-height:1.7">${escapeHTML(notes)}</p><small>公開日：${escapeHTML(manifest.releaseDate||'不明')}</small></div><p>現在のアプリ・設定・保存データはそのまま維持して、MangoOS本体を更新します。</p><div class="modal-actions"><button class="soft-button" id="mango-update-later">後で</button><button class="primary-button" id="mango-update-now">今すぐ更新</button></div>`);
  $('#mango-update-later').onclick=closeModal;$('#mango-update-now').onclick=async()=>{const button=$('#mango-update-now');button.disabled=true;button.textContent='更新しています…';try{await mangoosDownloadAndApply(manifest)}catch(err){button.disabled=false;button.textContent='再試行';const p=$('.modal p');if(p)p.textContent='更新に失敗しました：'+(err?.message||err);mangoosSetUpdateStatus(statusArea,'更新に失敗しました：'+(err?.message||err),'更新できませんでした')}};
 }catch(err){const msg='更新確認に失敗しました：'+(err?.message||String(err));mangoosSetUpdateStatus(statusArea,msg,'更新情報を取得できませんでした');if(!silent)showModal(`<h2>更新を確認できませんでした</h2><p>${escapeHTML(msg)}</p><p>GitHub Pagesのリポジトリに index.html と mangoos-update.json が公開されているか確認してください。</p><div class="modal-actions"><button class="primary-button" id="modal-cancel">閉じる</button></div>`),$('#modal-cancel').onclick=closeModal;}
 finally{if(checkButton&&checkButton.isConnected)checkButton.disabled=false}
}

async function updateHtmlAppFromFile(appId,file){
 const current=apps.find(a=>a.id===appId);
 if(!current){toast('更新できません','対象のHTMLアプリが見つかりません。');return}
 if(!/\.html?$/i.test(file.name)&&file.type!=='text/html'){toast('更新できません','HTMLファイルを選択してください。');return}
 try{
  const replacement=await file.text();
  if(!replacement.trim()||!/<(?:!doctype\s+html|html|head|body|script|main|div)\b/i.test(replacement)){
   toast('更新できません','HTMLとして読み取れないファイルです。');return;
  }
  // Keep the existing app ID and display name: this is an in-place update, not a reinstall.
  const updated={...current,html:replacement,sourceUrl:'',sourceFileName:file.name,updatedAt:Date.now()};
  await dbPut(updated);
  Object.assign(current,updated);
  const desktopItem=getItem(appId);
  if(desktopItem){desktopItem.title=current.title;renderDesktopIcons();savePositions()}
  const win=windows.get(appId);
  if(win){
   const frame=win.area.querySelector('iframe');
   if(frame){frame.title=current.title;setHtmlAppFrameSource(frame,current.html,appId,current.version||'');}
   const title=win.el.querySelector('.titlebar-title span:last-child');if(title)title.textContent=current.title;
   win.title=current.title;
   const task=$(`#window-task-buttons [data-window="${CSS.escape(appId)}"]`);if(task)task.title=current.title;
  }
  toast('アプリを更新しました',`${current.title} の内容を差し替えました。アプリの登録情報と保存データは維持されています。`);
 }catch(err){console.error(err);toast('更新に失敗しました','保存容量またはファイル形式を確認してください。')}
}

function updateClock(){const d=new Date();const tf=String(getMangoPref('timeFormat','24'));$('#clock-time').textContent=d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',hour12:tf==='12'});const df=String(getMangoPref('dateFormat','ja'));$('#clock-date').textContent=df==='ja-long'?d.toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric'}):df==='en'?d.toLocaleDateString('en-US',{year:'numeric',month:'2-digit',day:'2-digit'}):d.toLocaleDateString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit'}); }
function renderCalendar(){const now=new Date(),y=now.getFullYear(),m=now.getMonth(),weekStart=Number(getMangoPref('weekStart','0'))||0;$('#calendar-month').textContent=now.toLocaleDateString('ja-JP',{year:'numeric',month:'long'});$('#calendar-full-date').textContent=now.toLocaleDateString('ja-JP',{weekday:'long',month:'long',day:'numeric'});const first=(new Date(y,m,1).getDay()-weekStart+7)%7,days=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate(),weekdays=['日','月','火','水','木','金','土'];const ordered=weekdays.slice(weekStart).concat(weekdays.slice(0,weekStart));let html=ordered.map(x=>`<span class="weekday">${x}</span>`).join('');for(let i=0;i<42;i++){let day=i-first+1,cls='',n=day;if(day<1){n=prev+day;cls='dim'}else if(day>days){n=day-days;cls='dim'}else if(day===now.getDate())cls='today';html+=`<span class="${cls}">${n}</span>`}$('#calendar-grid').innerHTML=html}
// Keep browser/OS exit shortcuts from being interpreted as MangoOS actions.
// Normal gameplay keys (WASD, arrows, Space, etc.) continue to reach HTML apps.
const blockedBrowserCombos=new Set(['w','q','r','t','n','l','f','p','j','tab']);
function isTextEntry(target){return !!(target&&target.closest&&target.closest('input,textarea,select,[contenteditable="true"]'))}
function shouldBlockSystemKey(e,insideFrame=false){
 const k=String(e.key||'').toLowerCase();
 if(k==='escape'||k==='meta'||k==='os'||k==='f5'||/^f([1-9]|1[0-2])$/.test(k)||k==='browserback'||k==='browserforward'||k==='backspace'&&!isTextEntry(e.target))return true;
 if(e.altKey&&k==='f4')return true;
 if((e.ctrlKey||e.metaKey)&&blockedBrowserCombos.has(k))return true;
 if((e.ctrlKey||e.metaKey)&&e.shiftKey&&['w','q','t','i','j','c','m','d','delete'].includes(k))return true;
 if((e.ctrlKey||e.metaKey)&&['+','=','-','0'].includes(k))return true;
 if((e.ctrlKey||e.metaKey||e.altKey)&&!isTextEntry(e.target))return true;
 return false;
}
function guardKeyEvent(e,insideFrame=false,isMangoBattle=false){
 if(e.key==='F11'){
  e.preventDefault();e.stopPropagation();e.stopImmediatePropagation?.();
  if(!e.repeat&&!mangoShutdown)toggleMangoFullscreenFromKey();
  return;
 }
 // MangoBattle owns Escape while its Creative pause sidebar is active.
 if(e.key==='Escape'&&insideFrame)return;
 if(!insideFrame&&(e.key==='Meta'||e.key==='OS')){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation?.();if(!e.repeat&&!mangoShutdown){togglePanel('start-panel');if($('#start-panel').classList.contains('open'))renderStart()}return}
 if(shouldBlockSystemKey(e,insideFrame)){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation?.();}
}
// F11 is a MangoOS workspace command: app windows fill the MangoOS viewport and the OS taskbar hides.
function toggleMangoFullscreenFromKey(){
 hidePanels();
 const rec=activeWindow?windows.get(activeWindow):null;
 if(rec&&rec.el&&!rec.el.classList.contains('minimized')){
  const entering=!rec.el.classList.contains('mango-os-fullscreen');
  rec.el.classList.toggle('mango-os-fullscreen',entering);
  document.body.classList.toggle('mango-os-app-fullscreen',entering);
  if(entering){document.body.classList.remove('mango-os-desktop-fullscreen');rec.prevF11={left:rec.el.style.left,top:rec.el.style.top,width:rec.el.style.width,height:rec.el.style.height};rec.el.style.zIndex='40000';}
  else{if(rec.prevF11){rec.el.style.left=rec.prevF11.left;rec.el.style.top=rec.prevF11.top;rec.el.style.width=rec.prevF11.width;rec.el.style.height=rec.prevF11.height;rec.prevF11=null;}rec.el.style.zIndex=String(++nextZ);focusWindow(rec.el);}
  return;
 }
 const entering=document.body.classList.toggle('mango-os-desktop-fullscreen');
 toast('MangoOS 表示モード',entering?'デスクトップ領域を拡大しました。F11で元に戻せます。':'通常のデスクトップ表示に戻しました。');
}
function showAppEscapeMenu(frame){
 const id=frame?.closest('.app-window')?.dataset.win;
 const rec=id?windows.get(id):null;
 if(!rec||rec.el.classList.contains('minimized'))return;
 if($('#modal-layer')?.classList.contains('open'))return;
 showModal(`<h2>${escapeHTML(rec.title)}</h2><p>アプリのメニュー</p><div class="modal-actions"><button class="soft-button" id="app-escape-minimize">最小化</button><button class="soft-button" id="app-escape-close">ウィンドウを閉じる</button><button class="primary-button" id="app-escape-cancel">戻る</button></div>`);
 $('#app-escape-minimize')?.addEventListener('click',()=>{closeModal();minimizeWindow(id)});
 $('#app-escape-close')?.addEventListener('click',()=>{closeModal();closeWindow(id)});
 $('#app-escape-cancel')?.addEventListener('click',closeModal);
}
function installFrameKeyGuard(frame){
 const d=frame.contentDocument;if(!d||d.__mangoKeyGuard)return;d.__mangoKeyGuard=true;
 const isMangoBattle=frame.dataset.mangoSource==='github-pages-live'||!!d.querySelector('meta[name="mangoos-app"][content="mangobattle"]');
 d.addEventListener('contextmenu',e=>e.preventDefault(),true);
 const w=frame.contentWindow;
 // Capture Escape at the iframe Window level. A game's own handler still gets the
 // event afterward; if it does not prevent the default, MangoOS opens its common menu.
 w?.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
   setTimeout(()=>{if(!e.defaultPrevented)showAppEscapeMenu(frame);},0);
   return;
  }
 },true);
 d.addEventListener('keydown',e=>{
  if(e.key==='Escape')return;
  guardKeyEvent(e,true,isMangoBattle);
 },true);
 d.addEventListener('keyup',e=>{if(e.key==='Escape')return;if(['F11','Meta','OS'].includes(e.key)){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation?.()}},true);
 // Forward a real tap in an embedded HTML app to the top-level OS fullscreen handler.
 d.addEventListener('pointerdown',()=>requestBrowserFullscreenFromGesture(),{capture:true,once:true});
}
document.addEventListener('keydown',e=>guardKeyEvent(e,false),true);
document.addEventListener('keyup',e=>{if(['Escape','F11','Meta','OS'].includes(e.key)){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation?.()}},true);
// The browser controls tab/window closing. This is only a final warning, not a hard lock.
let mangoShutdown=false;
window.addEventListener('beforeunload',e=>{if(!mangoShutdown){e.preventDefault();e.returnValue=''}});

// Ask for browser fullscreen on the first real click/tap anywhere in MangoOS.
// This is separate from F11, which stays an internal MangoOS window command.
let mangoBrowserFullscreenRequested=false;
function requestBrowserFullscreenFromGesture(){
 if(document.fullscreenElement||mangoBrowserFullscreenRequested)return;
 try{
  const request=document.documentElement.requestFullscreen({navigationUI:'hide'});
  mangoBrowserFullscreenRequested=true;
  Promise.resolve(request).then(()=>{if(navigator.keyboard&&typeof navigator.keyboard.lock==='function')return navigator.keyboard.lock(['Escape','F11']).catch(err=>console.warn('Keyboard lock unavailable',err));}).catch(err=>{mangoBrowserFullscreenRequested=false;console.warn('Fullscreen request failed',err);});
 }catch(err){mangoBrowserFullscreenRequested=false;console.warn('Fullscreen request failed',err);}
}
document.addEventListener('pointerdown',()=>requestBrowserFullscreenFromGesture(),{capture:true});
document.addEventListener('fullscreenchange',()=>{mangoBrowserFullscreenRequested=!!document.fullscreenElement;if(document.fullscreenElement&&navigator.keyboard&&typeof navigator.keyboard.lock==='function')navigator.keyboard.lock(['Escape','F11']).catch(err=>console.warn('Keyboard lock unavailable',err));else if(!document.fullscreenElement){try{navigator.keyboard?.unlock?.()}catch{}}});
window.addEventListener('message',event=>{
 if(event.origin!==location.origin||!event.data)return;
 if(event.data.type==='MANGOOS_USER_GESTURE_FULLSCREEN')requestBrowserFullscreenFromGesture();
 if(event.data.type==='MANGOOS_CLOSE_ACTIVE_APP'){const id=activeWindow;if(id)closeWindow(id);}
});

async function init(){mangoShutdown=false;try{db=await openDB();apps=await dbAll()}catch(err){console.warn('IndexedDB unavailable',err);toast('保存機能','このブラウザーではアプリ保存が利用できない場合があります。')}makeDesktopItems();if(isPerformanceInstalled()&&(storage.getItem('mango-performance-overlay')==='1'||getMangoPref('startupPerformance',false))){perfState.overlay=true;ensurePerformanceOverlay().classList.add('show');startPerfSampler()}if(getMangoPref('startupStore',false))setTimeout(()=>{if(!mangoShutdown)openStore()},1200);const theme=storage.getItem('mango-theme');if(theme)setTheme(theme);const accent=storage.getItem('mango-accent');if(accent)document.documentElement.style.setProperty('--accent',accent);applyAllMangoPreferences();updateClock();setInterval(updateClock,1000);updateBackgroundTray();setTimeout(()=>$('#boot').classList.add('hide'),950);if(getMangoPref('autoUpdateMango',false))setTimeout(()=>checkMangoOSUpdates(document,true),1800)}
init();
})();
