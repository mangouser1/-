:7px 10px;border-radius:5px;cursor:pointer}.explorer-toolbar button:hover{background:var(--surface2)}.explorer-body{display:flex;height:calc(100% - 48px)}.explorer-nav{width:170px;background:var(--surface2);padding:12px 8px;border-right:1px solid var(--line)}.explorer-nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:transparent;border-radius:5px;padding:9px;font-size:12px;cursor:pointer}.explorer-nav button:hover{background:rgba(90,130,180,.12)}.explorer-files{flex:1;padding:20px;overflow:auto}.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:10px}.file-item{min-height:88px;border:1px solid transparent;border-radius:7px;background:transparent;padding:10px 5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;cursor:pointer;font-size:12px}.file-item:hover{background:var(--surface2);border-color:var(--line)}.file-item .file-icon{width:32px;height:32px;display:grid;place-items:center}.file-item .file-icon svg{width:28px;height:28px}.notepad{height:100%;display:flex;flex-direction:column}.notepad-toolbar{padding:7px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;font-size:12px}.notepad textarea{resize:none;border:0;outline:0;flex:1;padding:18px;font-family:Consolas,monospace;font-size:14px;background:var(--surface);color:var(--ink);user-select:text}.browser-page{padding:22px;background:var(--surface2);height:100%;overflow:auto}.browser-search{display:flex;gap:7px;margin:10px auto 30px;max-width:620px}.browser-search input{flex:1;border:1px solid var(--line);border-radius:7px;padding:11px 13px;background:var(--surface);user-select:text}.browser-card{max-width:620px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}.browser-links{display:flex;flex-wrap:wrap;gap:8px}.browser-links a{color:var(--accent);font-size:13px}.taskmgr-table{width:100%;border-collapse:collapse;font-size:12px}.taskmg #boot{position:fixed;inset:0;z-index:30000;background:#101b32;color:white;display:grid;place-items:center;transition:opacity .55s,visibility .55s}#boot.hide{opacity:0;visibility:hidden}.boot-inner{text-align:center;animation:bootPulse 1.3s ease-in-out infinite alternate}.boot-logo{width:74px;height:74px;border-radius:22px;background:linear-gradient(145deg,#8fc1ff,#3774cf);margin:0 auto 18px;display:grid;place-items:center;font-size:38px;box-shadow:0 12px 35px rgba(60,120,220,.35)}.boot-name{font-size:26px;font-weight:650;letter-spacing:.5px}.boot-sub{font-size:12px;opacity:.65;margin-top:8px}@keyframes bootPulse{to{transform:translateY(-4px);opacity:.85}}

/* Windows 11-inspired monochrome taskbar and power states. */
#taskbar{color:var(--ink);background:rgba(248,248,248,.9);border-top:1px solid rgba(0,0,0,.10)}
.task-btn,.tray-button{color:#242424}
.task-btn svg,.tray-button svg{width:22px;height:22px;display:block;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
#start-btn svg{fill:currentColor;stroke:none;width:23px;height:23px}
#weather-task svg{width:21px;height:21px}
.task-btn.running:after{background:#777}
.task-btn.current:after{background:#222}
.task-app-glyph{display:grid;place-items:center;width:23px;height:23px;color:#252525}
.task-app-glyph svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
#boot{background:#050505;color:#f7f7f7}
.boot-logo{width:74px;height:74px;border-radius:0;background:transparent;box-shadow:none;margin:0 auto 18px;display:grid;place-items:center}
.boot-logo svg{width:58px;height:58px;fill:#f5f5f5}
.boot-inner{text-align:center;animation:bootPulse 1.3s ease-in-out infinite alternate}
#shutdown-screen{position:fixed;inset:0;z-index:40000;display:none;place-items:center;background:#050505;color:#f5f5f5;text-align:center}
#shutdown-screen.show{display:grid;animation:shutdownFade .45s ease-out}
@keyframes shutdownFade{from{opacity:0}to{opacity:1}}
.shutdown-content{display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px}
.shutdown-logo svg{width:54px;height:54px;fill:#f5f5f5}
.shutdown-title{font-size:17px;font-weight:600;letter-spacing:.02em}
.shutdown-sub{font-size:12px;color:#aaa}
#power-on-btn{margin-top:28px;padding:10px 18px;border:1px solid #666;border-radius:6px;background:#171717;color:#fff;cursor:pointer;font-size:13px}
#power-on-btn:hover{background:#292929;border-color:#aaa}
.power-options{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:18px 0 4px}
.power-option{padding:14px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--ink);cursor:pointer;text-align:left}
.power-option:hover{background:rgba(130,130,130,.14);border-color:#888}
.power-option strong{display:block;font-size:13px;margin-bottom:3px}
.power-option small{display:block;color:var(--muted);font-size:11px}

 if(hostedSource){
  try{
   const hosted=new URL(hostedSource);
   if(hosted.protocol!=='https:'||hosted.hostname!=='mangouser1.github.io'||hosted.pathname!=='/-/MangoBattle.html')throw new Error('許可されていないアプリ配布元です。');
   frame.dataset.mangoSource='github-pages-live';
   // Cache-bust the hosted Creative game whenever its version changes.
   if(appKey.includes('mangobattle')||appId===MANGOBATTLE_STORE_ID){
    hosted.searchParams.set('mangoosAppVersion','0.14.7');
   }
   frame.src=hosted.href;

  frame.src='/apps/'+encodeURIComponent(appId)+'?v='+encodeURIComponent(version||Date.now());
  return;
 }
 if(isMangoBattle&&['http:','https:'].includes(location.protocol)){
  // GitHub Pages: use the HTML saved in the installed Store app record.
  // This avoids a 404 when MangoBattle.html has not been uploaded separately.
  // The game includes an early origin normalizer which maps about:srcdoc to
  // the same-origin parent URL before Firebase Auth modules are imported.
  const embedded=String((typeof html==='string'&&html.trim())?html:getMangoBattleStoreHTML());
  if(embedded.trim() && /<meta\s+name=["']mangoos-app["']\s+content=["']mangobattle["']/i.test(embedded)){
   frame.dataset.mangoSource='store-embedded';
   frame.srcdoc=persistentFrameHTML(embedded,appId);
   return;
  }

  // fallback for those, while the Store-installed app always uses its saved HTML.

  frame.src=gameUrl.href;

async function mangoosFetchManifest(){
 const candidates=[MANGOOS_UPDATE_MANIFEST_URL,MANGOOS_UPDATE_RAW_FALLBACK];let lastError=null;
 for(const url of candidates){try{const response=await fetch(url+(url.includes('?')?'&':'?')+'_='+Date.now(),{cache:'no-store',mode:'cors',credentials:'omit'});if(!response.ok)throw new Error('HTTP '+response.status);const data=await response.json();if(!data||data.product!=='MangoOS'||!data.latestVersion||!data.htmlUrl)throw new Error('更新情報の形式が正しくありません。');const target=new URL(data.htmlUrl,url);if(!['mangouser1.github.io'].includes(target.hostname))throw new Error('更新ファイルの配布元が許可されていません。');data._manifestUrl=url;data._htmlUrl=target.href;return data}catch(err){lastError=err}}

async function mangoosSha256(buffer){if(!crypto?.subtle)throw new Error('この環境では更新ファイルの安全性を確認できません。HTTPSのGitHub Pagesで開いてください。');const digest=await crypto.subtle.digest('SHA-256',buffer);return [...new Uint8Array(digest)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function mangoosDownloadAndApply(manifest){
 const url=manifest._htmlUrl+(manifest._htmlUrl.includes('?')?'&':'?')+'_='+Date.now();
 const response=await fetch(url,{cache:'no-store',mode:'cors',credentials:'omit'});if(!response.ok)throw new Error('更新ファイルをダウンロードできませんでした（HTTP '+response.status+'）。');
 const buffer=await response.arrayBuffer();if(buffer.byteLength<50000||buffer.byteLength>12*1024*1024)throw new Error('更新HTMLのサイズが想定範囲外です。');
 const actual=await mangoosSha256(buffer);if(!manifest.sha256||actual.toLowerCase()!==String(manifest.sha256).toLowerCase())throw new Error('更新ファイルのSHA-256が一致しません。マニフェストとHTMLを同時に公開してください。');
 const text=new TextDecoder('utf-8',{fatal:true}).decode(buffer);const versionMatch=text.match(/<meta\s+name=["']mangoos-version["']\s+content=["']([^"']+)["']/i);if(!versionMatch||versionMatch[1]!==manifest.latestVersion||!/<html[\s>]/i.test(text)||!/<title[^>]*>\s*MangoOS/i.test(text))throw new Error('更新ファイルのバージョンまたはHTML形式が一致しません。');
 if(MANGO_SERVER_MODE){const saved=await fetch('/api/update-os',{method:'POST',headers:{'Content-Type':'text/html; charset=utf-8'},body:buffer,cache:'no-store'});const result=await saved.json().catch(()=>({}));if(!saved.ok||!result.ok)throw new Error(result.error||'この端末のMangoOSファイルを更新できませんでした。');toast('MangoOSの更新','v'+manifest.latestVersion+'を適用しました。再起動します。');setTimeout(()=>location.reload(),900);return}

}
let mangoosUpdateCheckInFlight=false;

function mangoosNotifyUpdateAvailable(manifest){
 const version=String(manifest.latestVersion||'');
 if(!version)return false;
 try{if(localStorage.getItem('mangoos-update-notified-version')===version)return false;localStorage.setItem('mangoos-update-notified-version',version)}catch{}

  try{const n=new Notification('MangoOS の更新があります',{body:message,tag:'mangoos-update-'+version});n.onclick=()=>{try{window.focus();n.close()}catch{}}}catch(err){console.warn('Browser notification unavailable:',err)}

async function checkMangoOSUpdates(area,silent=false,fromMonitor=false){
 if(mangoosUpdateCheckInFlight)return;
 mangoosUpdateCheckInFlight=true;
 const statusArea=area||document;
 const checkButton=$('[data-setting-action="check-update"]',statusArea);
 if(checkButton)checkButton.disabled=true;
 mangoosSetUpdateStatus(statusArea,'GitHub Pagesから更新情報を確認しています…','更新を確認しています');
 try{
  const manifest=await mangoosFetchManifest();
  mangoosLastUpdateManifest=manifest;
  const comparison=mangoosCompareVersions(manifest.latestVersion,MANGOOS_BUILD_VERSION);
  const checked=new Date().toLocaleString('ja-JP');
  if(comparison<=0){
   const msg='最新の状態です。現在 v'+MANGOOS_BUILD_VERSION+'（確認：'+checked+'）';
   mangoosSetUpdateStatus(statusArea,msg,'MangoOS は最新の状態です');
   if(!silent)toast('MangoOS Update','新しい更新プログラムはありません。');
   return;
  }
  const versionKey='mangoos-update-notified-version';
  let alreadyNotified=false;
  try{alreadyNotified=localStorage.getItem(versionKey)===String(manifest.latestVersion)}catch{}
  if(fromMonitor&&alreadyNotified){
   mangoosSetUpdateStatus(statusArea,'新しいバージョン v'+manifest.latestVersion+' が公開されています。通知済みです。','更新プログラムがあります');
   return;
  }
  if(fromMonitor)mangoosNotifyUpdateAvailable(manifest);
  else if(!alreadyNotified){try{localStorage.setItem(versionKey,String(manifest.latestVersion))}catch{}}
  const notes=Array.isArray(manifest.releaseNotes)?manifest.releaseNotes.join('\n'):String(manifest.releaseNotes||'改善と不具合修正');
  mangoosSetUpdateStatus(statusArea,'新しいバージョン v'+manifest.latestVersion+' が見つかりました。','更新プログラムがあります');
  showModal(`<h2>MangoOS の更新</h2><p>新しいバージョン <strong>v${escapeHTML(manifest.latestVersion)}</strong> が見つかりました。</p><div class="settings-card" style="padding:13px;margin:12px 0"><strong>更新内容</strong><p style="white-space:pre-line;line-height:1.7">${escapeHTML(notes)}</p><small>公開日：${escapeHTML(manifest.releaseDate||'不明')}</small></div><p>現在のアプリ・設定・保存データはそのまま維持して、MangoOS本体を更新します。</p><div class="modal-actions"><button class="soft-button" id="mango-update-later">後で</button><button class="primary-button" id="mango-update-now">今すぐ更新</button></div>`);
  $('#mango-update-later').onclick=closeModal;
  $('#mango-update-now').onclick=async()=>{
   const button=$('#mango-update-now');button.disabled=true;button.textContent='更新しています…';
   try{await mangoosDownloadAndApply(manifest)}catch(err){button.disabled=false;button.textContent='再試行';const p=$('.modal p');if(p)p.textContent='更新に失敗しました：'+(err?.message||err);mangoosSetUpdateStatus(statusArea,'更新に失敗しました：'+(err?.message||err),'更新できませんでした')}
  };
 }catch(err){
  const msg='更新確認に失敗しました：'+(err?.message||String(err));
  mangoosSetUpdateStatus(statusArea,msg,'更新情報を取得できませんでした');
  if(!silent)showModal(`<h2>更新を確認できませんでした</h2><p>${escapeHTML(msg)}</p><p>GitHub Pagesのリポジトリ直下に index.html、MangoOSのバージョン別HTML、mangoos-update.json が公開されているか確認してください。</p><div class="modal-actions"><button class="primary-button" id="modal-cancel">閉じる</button></div>`),$('#modal-cancel').onclick=closeModal;
 }finally{
  mangoosUpdateCheckInFlight=false;
  if(checkButton&&checkButton.isConnected)checkButton.disabled=false;
 }
}

 $('#app-escape-minimize')?.addEventListener('click',()=>{closeModal();minimizeWindow(id)});

function installFrameKeyGuard(frame){
 const d=frame.contentDocument;if(!d||d.__mangoKeyGuard)return;d.__mangoKeyGuard=true;
 const isMangoBattle=frame.dataset.mangoSource==='github-pages-live'||!!d.querySelector('meta[name="mangoos-app"][content="mangobattle"]');
 d.addEventListener('contextmenu',e=>e.preventDefault(),true);
 const w=frame.contentWindow;
 // Capture Escape at the iframe Window level. A game's own handler still gets the
 // event afterward; if it does not prevent the default, MangoOS opens its common menu.
 w?.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
   setTimeout(()=>{if(!e.defaultPrevented)showAppEscapeMenu(frame);},0);
   return;
  }
 },true);
 d.addEventListener('keydown',e=>{
  if(e.key==='Escape')return;
  guardKeyEvent(e,true,isMangoBattle);
 },true);
 d.addEventListener('keyup',e=>{if(e.key==='Escape')return;if(['F11','Meta','OS'].includes(e.key)){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation?.()}},true);

}

document.addEventListener('keyup',e=>{if(['Escape','F11','Meta','OS'].includes(e.key)){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation?.()}},true);
// The browser controls tab/window closing. This is only a final warning, not a hard lock.
let mangoShutdown=false;
window.addEventListener('beforeunload',e=>{if(!mangoShutdown){e.preventDefault();e.returnValue=''}});

// Ask for browser fullscreen on the first real click/tap anywhere in MangoOS.
// This is separate from F11, which stays an internal MangoOS window command.
let mangoBrowserFullscreenRequested=false;
function requestBrowserFullscreenFromGesture(){
 if(document.fullscreenElement||mangoBrowserFullscreenRequested)return;
 try{
  const request=document.documentElement.requestFullscreen({navigationUI:'hide'});
  mangoBrowserFullscreenRequested=true;
  Promise.resolve(request).then(()=>{if(navigator.keyboard&&typeof navigator.keyboard.lock==='function')return navigator.keyboard.lock(['Escape','F11']).catch(err=>console.warn('Keyboard lock unavailable',err));}).catch(err=>{mangoBrowserFullscreenRequested=false;console.warn('Fullscreen request failed',err);});
 }catch(err){mangoBrowserFullscreenRequested=false;console.warn('Fullscreen request failed',err);}
}
document.addEventListener('pointerdown',()=>requestBrowserFullscreenFromGesture(),{capture:true});

 if(event.origin!==location.origin||!event.data)return;

});

// Boot duration adapts to the device instead of using one fixed delay.
const MANGO_BOOT_PROFILE=(()=>{
 const cores=Math.max(1,Number(navigator.hardwareConcurrency)||4);
 const memory=Math.max(1,Number(navigator.deviceMemory)||4);
 const low=cores<=4||memory<=4;
 const high=cores>=8&&memory>=8;
 return {
  tier:low?'低負荷モード':high?'高性能モード':'標準モード',
  minDuration:low?1600:high?700:1100,
  dbOpenTimeout:low?6500:high?3500:5000,
  dbReadTimeout:low?3500:high?1800:2500
 };
})();
let mangoBootFinished=false,mangoBootWatchdogTimer=0;
function setMangoBootStatus(message){const node=$('#boot .boot-sub');if(node)node.textContent=message}
function finishMangoBoot(){
 if(mangoBootFinished)return;
 mangoBootFinished=true;
 if(mangoBootWatchdogTimer)clearTimeout(mangoBootWatchdogTimer);
 const screen=$('#boot');if(screen)screen.classList.add('hide');
}
function mangoBootWithTimeout(value,ms,label){
 let timer=0;
 return Promise.race([
  Promise.resolve(value),
  new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error(label)),ms)})
 ]).finally(()=>clearTimeout(timer));
}
// Final watchdog: even an unexpected browser/storage stall must not leave the boot overlay forever.
mangoBootWatchdogTimer=setTimeout(()=>{
 if(!mangoBootFinished){
  console.warn('MangoOS boot watchdog activated; displaying desktop in fallback mode.');
  setMangoBootStatus('起動処理が遅れています。簡易起動に切り替えます…');
  finishMangoBoot();
 }
},14000);

async function init(){
 const bootStarted=performance.now();
 mangoShutdown=false;
 try{
  setMangoBootStatus(MANGO_BOOT_PROFILE.tier+'でシステムを準備しています…');
  let openPromise=null;
  try{
   openPromise=openDB();
   db=await mangoBootWithTimeout(openPromise,MANGO_BOOT_PROFILE.dbOpenTimeout,'ストレージの初期化がタイムアウトしました');
  }catch(err){
   console.warn('MangoOS storage initialization fallback:',err);
   if(openPromise)openPromise.then(late=>{if(late&&late!=='remote'&&late!==db&&typeof late.close==='function')late.close()}).catch(()=>{});
   db=null;
   try{apps=fallbackApps()}catch(fallbackError){console.warn('MangoOS local fallback unavailable:',fallbackError);apps=[]}
   try{toast('保存機能','保存データの読み込みに時間がかかったため、簡易モードで起動しました。') }catch{}
  }
  if(db!==null){
   try{apps=await mangoBootWithTimeout(dbAll(),MANGO_BOOT_PROFILE.dbReadTimeout,'保存データの読み込みがタイムアウトしました')}
   catch(err){
    console.warn('MangoOS app data loading fallback:',err);
    try{apps=fallbackApps()}catch(fallbackError){console.warn('MangoOS local fallback unavailable:',fallbackError);apps=[]}
    try{toast('保存機能','アプリ一覧を簡易モードで読み込みました。')}catch{}
   }
  }
  setMangoBootStatus('デスクトップを準備しています…');
  try{makeDesktopItems()}catch(err){
   console.error('MangoOS desktop item creation failed; retrying without imported apps:',err);
   apps=[];
   try{makeDesktopItems()}catch(retryError){console.error('MangoOS desktop fallback failed:',retryError)}
  }
  const safeStep=(label,fn)=>{try{fn()}catch(err){console.warn('MangoOS startup step failed ('+label+'):',err)}};
  safeStep('performance overlay',()=>{if(isPerformanceInstalled()&&(storage.getItem('mango-performance-overlay')==='1'||getMangoPref('startupPerformance',false))){perfState.overlay=true;ensurePerformanceOverlay().classList.add('show');startPerfSampler()}});
  safeStep('startup store',()=>{if(getMangoPref('startupStore',false))setTimeout(()=>{if(!mangoShutdown)openStore()},1200)});
  safeStep('theme',()=>{const theme=storage.getItem('mango-theme');if(theme)setTheme(theme);const accent=storage.getItem('mango-accent');if(accent)document.documentElement.style.setProperty('--accent',accent)});
  safeStep('preferences',()=>applyAllMangoPreferences());
  safeStep('clock',()=>{updateClock();setInterval(updateClock,1000)});
  safeStep('background tray',()=>updateBackgroundTray());
  safeStep('automatic update monitor',()=>startMangoOSUpdateMonitor());
 }catch(err){
  console.error('MangoOS startup recovered from an unexpected error:',err);
  try{if(!Array.isArray(apps))apps=[];makeDesktopItems()}catch(recoveryError){console.error('MangoOS final desktop recovery failed:',recoveryError)}
  try{toast('MangoOS','一部の機能を省略して起動しました。設定や保存データを確認してください。')}catch{}
 }finally{
  const remaining=Math.max(0,MANGO_BOOT_PROFILE.minDuration-(performance.now()-bootStarted));
  if(remaining)await new Promise(resolve=>setTimeout(resolve,remaining));
  finishMangoBoot();
 }
}
init();
})();
</script>

<script type="module">

const config={apiKey:'AIzaSyDq2pWTYv6JNdhZJLzy4HJ2RD-q2kK0iII',authDomain:'mangonite2.firebaseapp.com',databaseURL:'https://mangonite2-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'mangonite2',messagingSenderId:'439496116451',appId:'1:439496116451:web:70d976a593d429abc7ddd6'};
const MAX_HTML_BYTES=1024*1024;
const CHUNK_BYTES=48*1024;
let app,auth,db,communityRows=[];
const withTimeout=(promise,ms,message)=>new Promise((resolve,reject)=>{

 window.__MangoCommunityUpload=async({file,title,description,category,icon,onProgress})=>{
  const user=auth.currentUser;
  if(!user)throw Object.assign(new Error('Googleログインしてください。'),{code:'auth/unauthenticated'});

  let metadataCreated=false;

   metadataCreated=true;

   for(let i=0;i<chunks.length;i++){
    const key=String(i).padStart(5,'0');
    await withTimeout(set(dbRef(db,`publicStore/appFiles/${id}/chunks/${key}`),chunks[i].text),25000,`HTMLの${i+1}/${chunks.length}ブロック目の保存が25秒でタイムアウトしました。`);
