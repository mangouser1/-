<style>

-resize-note{position:absolute;right:3px;bottom:2px;width:12px;height:12px;pointer-events:none;opacity:.3}

:7px 10px;border-radius:5px;cursor:pointer}.explorer-toolbar button:hover{background:var(--surface2)}.explorer-body{display:flex;height:calc(100% - 48px)}.explorer-nav{width:170px;background:var(--surface2);padding:12px 8px;border-right:1px solid var(--line)}.explorer-nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:transparent;border-radius:5px;padding:9px;font-size:12px;cursor:pointer}.explorer-nav button:hover{background:rgba(90,130,180,.12)}.explorer-files{flex:1;padding:20px;overflow:auto}.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:10px}.file-item{min-height:88px;border:1px solid transparent;border-radius:7px;background:transparent;padding:10px 5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;cursor:pointer;font-size:12px}.file-item:hover{background:var(--surface2);border-color:var(--line)}.file-item .file-icon{width:32px;height:32px;display:grid;place-items:center}.file-item .file-icon svg{width:28px;height:28px}.notepad{height:100%;display:flex;flex-direction:column}.notepad-toolbar{padding:7px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;font-size:12px}.notepad textarea{resize:none;border:0;outline:0;flex:1;padding:18px;font-family:Consolas,monospace;font-size:14px;background:var(--surface);color:var(--ink);user-select:text}.browser-page{padding:22px;background:var(--surface2);height:100%;overflow:auto}.browser-search{display:flex;gap:7px;margin:10px auto 30px;max-width:620px}.browser-search input{flex:1;border:1px solid var(--line);border-radius:7px;padding:11px 13px;background:var(--surface);user-select:text}.browser-card{max-width:620px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}.browser-links{display:flex;flex-wrap:wrap;gap:8px}.browser-links a{color:var(--accent);font-size:13px}.taskmgr-table{width:100%;border-collapse:collapse;font-size:12px}.taskmg /* Menus and dialogs */
#context-menu{position:fixed;z-index:15000;min-width:205px;padding:5px;background:var(--panel-bg);border:1px solid rgba(255,255,255,.8);border-radius:8px;box-shadow:var(--shadow);backdrop-filter:blur(25px);display:none}#context-menu.open{display:block;animation:panelIn .1s ease-out}.context-item{display:block;width:100%;border:0;background:transparent;text-align:left;padding:9px 11px;border-radius:5px;font-size:12px;cursor:pointer}.context-item:hover{background:rgba(80,130,205,.15)}.context-sep{height:1px;background:var(--line);margin:4px 6px}#modal-layer{position:fixed;inset:0;z-index:20000;background:rgba(10,20,35,.32);display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}#modal-layer.open{display:flex}.modal{width:420px;max-width:calc(100vw - 30px);padding:23px;border-radius:12px;background:var(--surface);box-shadow:0 20px 70px rgba(0,0,0,.3);animation:windowIn .15s ease-out}.modal h2{margin:0 0 7px;font-size:20px}.modal p{font-size:13px;color:var(--muted);line-height:1.6}.modal input{width:100%;padding:11px;border-radius:6px;border:1px solid var(--line);outline:none;background:var(--surface2);color:var(--ink);user-select:text}.modal input:focus{border-color:var(--accent)}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.modal-error{color:#c83737;font-size:12px;min-height:18px;margin-top:7px}
#boot{position:fixed;inset:0;z-index:30000;background:#101b32;color:white;display:grid;place-items:center;transition:opacity .55s,visibility .55s}#boot.hide{opacity:0;visibility:hidden}.boot-inner{text-align:center;animation:bootPulse 1.3s ease-in-out infinite alternate}.boot-logo{width:74px;height:74px;border-radius:22px;background:linear-gradient(145deg,#8fc1ff,#3774cf);margin:0 auto 18px;display:grid;place-items:center;font-size:38px;box-shadow:0 12px 35px rgba(60,120,220,.35)}.boot-name{font-size:26px;font-weight:650;letter-spacing:.5px}.boot-sub{font-size:12px;opacity:.65;margin-top:8px}@keyframes bootPulse{to{transform:translateY(-4px);opacity:.85}}
#toast-area{position:fixed;right:18px;bottom:calc(var(--taskbar-h) + 18px);z-index:18000;display:flex;flex-direction:column;gap:8px;pointer-events:none}.toast{background:var(--panel-bg);border:1px solid rgba(255,255,255,.75);border-radius:9px;padding:13px 16px;min-width:230px;max-width:330px;box-shadow:var(--shadow);font-size:13px;backdrop-filter:blur(20px);animation:toastIn .2s ease-out}@keyframes toastIn{from{opacity:0;transform:translateX(15px)}to{opacity:1;transform:none}}.toast strong{display:block;margin-bottom:4px}.empty-state{padding:30px;text-align:center;color:var(--muted);font-size:13px}
body.dark{--panel-bg:rgba(34,39,49,.9);--surface:#252a34;--surface2:#1d222b;--ink:#f1f3f7;--muted:#aab2c0;--line:rgba(220,230,245,.13);color-scheme:dark}body.dark #taskbar{background:rgba(27,32,42,.84);border-color:rgba(255,255,255,.08)}body.dark .panel-search,body.dark .modal input{background:#1c212a;border-color:#465165}body.dark .quick-tile{background:rgba(60,68,82,.65)}body.dark .quick-tile.on{background:#29476f;border-color:#4e79b6}body.dark .app-window{border-color:rgba(255,255,255,.12)}body.dark .desktop-icon.selected{background:rgba(85,140,220,.4)}

/* Windows 11-inspired monochrome taskbar and power states. */
#taskbar{color:var(--ink);background:rgba(248,248,248,.9);border-top:1px solid rgba(0,0,0,.10)}
.task-btn,.tray-button{color:#242424}
.task-btn svg,.tray-button svg{width:22px;height:22px;display:block;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
#start-btn svg{fill:currentColor;stroke:none;width:23px;height:23px}
#weather-task svg{width:21px;height:21px}
.task-btn.running:after{background:#777}
.task-btn.current:after{background:#222}
.task-app-glyph{display:grid;place-items:center;width:23px;height:23px;color:#252525}
.task-app-glyph svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
#boot{background:#050505;color:#f7f7f7}
.boot-logo{width:74px;height:74px;border-radius:0;background:transparent;box-shadow:none;margin:0 auto 18px;display:grid;place-items:center}
.boot-logo svg{width:58px;height:58px;fill:#f5f5f5}
.boot-inner{text-align:center;animation:bootPulse 1.3s ease-in-out infinite alternate}
#shutdown-screen{position:fixed;inset:0;z-index:40000;display:none;place-items:center;background:#050505;color:#f5f5f5;text-align:center}
#shutdown-screen.show{display:grid;animation:shutdownFade .45s ease-out}
@keyframes shutdownFade{from{opacity:0}to{opacity:1}}
.shutdown-content{display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px}
.shutdown-logo svg{width:54px;height:54px;fill:#f5f5f5}
.shutdown-title{font-size:17px;font-weight:600;letter-spacing:.02em}
.shutdown-sub{font-size:12px;color:#aaa}
#power-on-btn{margin-top:28px;padding:10px 18px;border:1px solid #666;border-radius:6px;background:#171717;color:#fff;cursor:pointer;font-size:13px}
#power-on-btn:hover{background:#292929;border-color:#aaa}
.power-options{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:18px 0 4px}
.power-option{padding:14px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--ink);cursor:pointer;text-align:left}
.power-option:hover{background:rgba(130,130,130,.14);border-color:#888}
.power-option strong{display:block;font-size:13px;margin-bottom:3px}
.power-option small{display:block;color:var(--muted);font-size:11px}

async function updateHtmlAppFromFile(appId,file){
 const current=apps.find(a=>a.id===appId);
 if(!current){toast('更新できません','対象のHTMLアプリが見つかりません。');return}
 if(!/\.html?$/i.test(file.name)&&file.type!=='text/html'){toast('更新できません','HTMLファイルを選択してください。');return}
 try{
  const replacement=await file.text();
  if(!replacement.trim()||!/<(?:!doctype\s+html|html|head|body|script|main|div)\b/i.test(replacement)){
   toast('更新できません','HTMLとして読み取れないファイルです。');return;
  }
  // Keep the existing app ID and display name: this is an in-place update, not a reinstall.
  const updated={...current,html:replacement,sourceFileName:file.name,updatedAt:Date.now()};
  await dbPut(updated);
  Object.assign(current,updated);
  const desktopItem=getItem(appId);
  if(desktopItem){desktopItem.title=current.title;renderDesktopIcons();savePositions()}
  const win=windows.get(appId);
  if(win){
   const frame=win.area.querySelector('iframe');
   if(frame){frame.title=current.title;if(MANGO_SERVER_MODE&&appId==='mangobattle-store-app')frame.src='/apps/'+encodeURIComponent(appId)+'?v='+Date.now();else frame.srcdoc=persistentFrameHTML(current.html,appId)}
   const title=win.el.querySelector('.titlebar-title span:last-child');if(title)title.textContent=current.title;
   win.title=current.title;
   const task=$(`#window-task-buttons [data-window="${CSS.escape(appId)}"]`);if(task)task.title=current.title;
  }
  toast('アプリを更新しました',`${current.title} の内容を差し替えました。アプリの登録情報と保存データは維持されています。`);
 }catch(err){console.error(err);toast('更新に失敗しました','保存容量またはファイル形式を確認してください。')}
}

$('#context-menu').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=contextTarget;hideContext();if(a==='open'&&id)launchItem(id);if(a==='rename'&&id){renameDesktopItem(id)}if(a==='delete'&&id){const it=getItem(id);if(it?.type==='html'){dbDelete(id);apps=apps.filter(x=>x.id!==id);desktopItems=desktopItems.filter(x=>x.id!==id);selected.delete(id);savePositions();renderDesktopIcons();toast('削除しました',it.title)}else toast('この項目は削除できません','システム アイコンです。')}if(a==='properties'&&id){showAppProperties(id)}if(a==='refresh'){renderDesktopIcons();toast('デスクトップ','最新の情報に更新しました')}if(a==='sort'){desktopItems.sort((x,y)=>x.title.localeCompare(y.title,'ja'));const b=gridBounds();desktopItems.forEach((it,i)=>{const c={col:Math.floor(i/b.rows),row:i%b.rows};Object.assign(it,positionFromCell(c.col,c.row))});renderDesktopIcons();savePositions()}if(a==='view')toast('表示','デスクトップ アイコンを表示しています');if(a==='display')launchBuiltin('settings');if(a==='personal'){launchBuiltin('settings');setTimeout(()=> $('[data-page="personal"]')?.click(),80)}if(a==='new')toast('新規作成','HTMLアプリは「設定」から追加できます。')});

$('#start-btn').addEventListener('click',()=>{togglePanel('start-panel');if($('#start-panel').classList.contains('open'))renderStart()});$('#search-btn').addEventListener('click',()=>{togglePanel('search-panel');if($('#search-panel').classList.contains('open')){$('#global-search').focus();renderSearch('')}});$('#taskview-btn').addEventListener('click',()=>{togglePanel('taskview-panel');updateTaskView()});$('#explorer-btn').addEventListener('click',openExplorer);$('#browser-btn').addEventListener('click',openBrowser);$('#settings-btn').addEventListener('click',openSettings);$('#network-btn').addEventListener('click',()=>togglePanel('quick-panel'));$('#volume-btn').addEventListener('click',()=>togglePanel('quick-panel'));$('#battery-btn').addEventListener('click',()=>togglePanel('quick-panel'));$('#clock').addEventListener('click',()=>{renderCalendar();togglePanel('calendar-panel')});$('#tray-hidden').addEventListener('click',openBackgroundPanel);$('#weather-task').addEventListener('click',()=>toast('天気','天気情報はブラウザーで確認できます。'));
const quickState={wifi:getMangoPref('wifiEnabled',true),bluetooth:getMangoPref('bluetoothEnabled',false),airplane:getMangoPref('airplaneMode',false),battery:false};$$('[data-quick]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.quick;quickState[k]=!quickState[k];b.classList.toggle('on',quickState[k]);if(k==='wifi')setMangoPref('wifiEnabled',quickState[k]);if(k==='bluetooth')setMangoPref('bluetoothEnabled',quickState[k]);if(k==='airplane')setMangoPref('airplaneMode',quickState[k]);$('#quick-status').textContent=quickState.airplane?'機内モード':quickState.wifi?'Wi-Fi 表示オン':'Wi-Fi 表示オフ'}));$('#brightness-slider').value=getMangoPref('displayBrightness',100);$('#volume-slider').value=getMangoPref('volume',70);$('#brightness-slider').addEventListener('input',e=>setMangoPref('displayBrightness',Number(e.target.value)));$('#volume-slider').addEventListener('input',e=>setMangoPref('volume',Number(e.target.value)));
function getAppsForMenu(){return [...builtin.map(b=>({id:b.id,title:b.title,icon:b.icon,kind:b.kind})),...(isPerformanceInstalled()?[{id:'performance',title:'パフォーマンス',icon:'performance',kind:'performance'}]:[]),...apps.map(a=>({id:a.id,title:a.title,icon:'app',kind:'html'})),{id:'taskmgr',title:'タスク マネージャー',icon:'taskmgr',kind:'taskmgr'}]}
function bindStartLaunches(root){$$('[data-launch]',root).forEach(b=>b.addEventListener('click',()=>{closeAllPanels();launchIdAnywhere(b.dataset.launch)}))}
function renderStart(){const all=getAppsForMenu();const list=all.slice(0,12);$('#pinned-grid').innerHTML=list.map(a=>`<button class="pinned-app" data-launch="${escapeHTML(a.id)}"><span class="pico">${iconHTML(a.icon||'app')}</span><span>${escapeHTML(a.title)}</span></button>`).join('');const recent=[...windows.values()].slice(-4).reverse().map(w=>({id:w.id,title:w.title,icon:w.icon||'app',detail:'最近使用したアプリ'}));const rec=recent.length?recent:all.slice(-4).reverse().map(a=>({...a,detail:'アプリ'}));$('#recommended-apps').innerHTML=rec.map(a=>`<button class="recommended-item" data-launch="${escapeHTML(a.id)}"><span class="rec-icon">${iconHTML(a.icon||'app')}</span><span><strong>${escapeHTML(a.title)}</strong><small>${escapeHTML(a.detail)}</small></span></button>`).join('');bindStartLaunches($('#start-panel'))}
$('#all-apps-btn').addEventListener('click',()=>{const all=getAppsForMenu();$('#pinned-grid').innerHTML=all.map(a=>`<button class="pinned-app" data-launch="${escapeHTML(a.id)}"><span class="pico">${iconHTML(a.icon||'app')}</span><span>${escapeHTML(a.title)}</span></button>`).join('');bindStartLaunches($('#pinned-grid'))});
$('#recommended-more').addEventListener('click',()=>$('#all-apps-btn').click());
function renderSearch(q){const list=getAppsForMenu().filter(a=>a.title.toLowerCase().includes(q.toLowerCase()));$('#search-results').innerHTML=list.map(a=>`<button class="search-result" data-launch="${escapeHTML(a.id)}"><span>${iconHTML(a.icon||'app')}</span><span>${escapeHTML(a.title)}</span></button>`).join('')||'<div class="empty-state">一致するアプリがありません</div>';$$('[data-launch]',$('#search-results')).forEach(b=>b.addEventListener('click',()=>{closeAllPanels();launchIdAnywhere(b.dataset.launch)}))}
$('#global-search').addEventListener('input',e=>renderSearch(e.target.value));$('#start-search').addEventListener('input',e=>{const q=e.target.value;$('#search-results').innerHTML='';$('#pinned-grid').innerHTML=getAppsForMenu().filter(a=>a.title.toLowerCase().includes(q.toLowerCase())).map(a=>`<button class="pinned-app" data-launch="${escapeHTML(a.id)}"><span class="pico">${iconHTML(a.icon||'app')}</span><span>${escapeHTML(a.title)}</span></button>`).join('');$$('[data-launch]',$('#pinned-grid')).forEach(b=>b.addEventListener('click',()=>{closeAllPanels();launchIdAnywhere(b.dataset.launch)}))});
function getBackgroundApps(){
 const list=[];
 for(const w of windows.values()){
  if(w.el.classList.contains('minimized')||w.minimizing||w.el.classList.contains('minimizing')){
   list.push({id:w.id,title:w.title,icon:w.icon||'app',detail:'バックグラウンドで実行中',kind:'window'});
  }
 }
 if(perfState.overlay){
  const existing=list.find(x=>x.id==='performance');
  if(existing)existing.detail='最小化中・FPSオーバーレイ実行中';
  else list.push({id:'performance',title:'パフォーマンス',icon:'performance',detail:'FPSオーバーレイ実行中',kind:'service'});
 }
 return list;
}
function updateBackgroundTray(){
 const list=getBackgroundApps(),root=$('#background-app-list'),empty=$('#background-app-empty'),count=$('#background-app-count'),button=$('#tray-hidden');
 if(!root||!empty||!button)return;
 root.innerHTML=list.map(item=>`<div class="background-app-row" data-background-id="${escapeHTML(item.id)}" role="group" aria-label="${escapeHTML(item.title)}">
  <button class="background-app-row-main" data-background-open="${escapeHTML(item.id)}" style="display:flex;align-items:center;gap:8px;flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:0;color:inherit;cursor:pointer">
   <span class="background-app-icon">${iconHTML(item.icon)}</span><span class="background-app-meta"><strong>${escapeHTML(item.title)}</strong><small>${escapeHTML(item.detail)}</small></span>
  </button><button class="background-app-end" data-background-end="${escapeHTML(item.id)}" title="${escapeHTML(item.title)}を終了" aria-label="${escapeHTML(item.title)}を終了">×</button>
 </div>`).join('');
 if(count)count.textContent=String(list.length);
 empty.hidden=list.length>0;
 button.classList.toggle('has-background',list.length>0);
 button.title=list.length?`バックグラウンド アプリ ${list.length}件`:'バックグラウンド アプリ';
}
function openBackgroundApp(id){closeAllPanels();if(windows.has(id)){restoreWindow(id);return}if(id==='performance'&&perfState.overlay){openPerformance();return}launchIdAnywhere(id)}
function endBackgroundApp(id){
 if(id==='performance'){
  if(perfState.overlay)setPerformanceOverlay(false);
  if(windows.has('performance'))closeWindow('performance');
  else stopPerfSampler();
 }else if(windows.has(id))closeWindow(id);
 updateBackgroundTray();
}
function openBackgroundPanel(){
 updateBackgroundTray();
 const panel=$('#background-panel'),button=$('#tray-hidden');
 const rect=button.getBoundingClientRect();
 panel.style.right=Math.max(8,innerWidth-rect.right)+'px';
 button.setAttribute('aria-expanded',String(!panel.classList.contains('open')));
 togglePanel('background-panel');
 if(!panel.classList.contains('open'))button.setAttribute('aria-expanded','false');
}
$('#background-app-list').addEventListener('click',e=>{
 const end=e.target.closest('[data-background-end]');
 if(end){e.stopPropagation();endBackgroundApp(end.dataset.backgroundEnd);return}
 const open=e.target.closest('[data-background-open]');
 if(open)openBackgroundApp(open.dataset.backgroundOpen);
});
function updateTaskView(){const box=$('#taskview-list');const list=[...windows.values()];box.innerHTML=list.map(w=>`<div class="taskview-card" data-restore="${escapeHTML(w.id)}"><strong>${iconHTML(w.icon||'app')} ${escapeHTML(w.title)}</strong><div class="taskview-preview">${iconHTML(w.icon||'app')}</div></div>`).join('')||'<div class="empty-state">開いているウィンドウはありません</div>';$$('[data-restore]',box).forEach(b=>b.addEventListener('click',()=>{closeAllPanels();restoreWindow(b.dataset.restore)}))}
$('#new-desktop-btn').addEventListener('click',()=>toast('デスクトップ','仮想デスクトップ機能は準備中です。'));
$('#power-btn').addEventListener('click',()=>{showModal(`<h2>電源</h2><p>MangoOS の電源操作を選択してください。</p><div class="power-options"><button class="power-option" id="power-restart"><strong>${iconHTML('update')} 再起動</strong><small>MangoOSを再起動します</small></button><button class="power-option" id="power-shutdown"><strong>${iconHTML('power')} シャットダウン</strong><small>デスクトップを終了します</small></button></div><div class="modal-actions"><button class="soft-button" id="modal-cancel">キャンセル</button></div>`);$('#modal-cancel').onclick=closeModal;$('#power-restart').onclick=()=>{closeModal();restartMangoOS()};$('#power-shutdown').onclick=()=>{closeModal();shutdownMangoOS()}});
function clearRunningApps(){windows.forEach(w=>w.el.remove());windows.clear();$('#window-task-buttons').innerHTML='';activeWindow=null;closeAllPanels();hideContext();closeModal();updateBackgroundTray()}
function shutdownMangoOS(){mangoShutdown=true;stopPerfSampler();$('#mango-performance-overlay')?.classList.remove('show');document.body.classList.remove('mango-os-desktop-fullscreen');clearRunningApps();document.body.classList.add('mango-shutdown');$('#shutdown-screen').classList.add('show');}
function restartMangoOS(){mangoShutdown=false;clearRunningApps();document.body.classList.remove('mango-shutdown');$('#shutdown-screen').classList.remove('show');$('#boot').classList.remove('hide');setTimeout(()=>$('#boot').classList.add('hide'),1100)}
$('#power-on-btn').addEventListener('click',()=>restartMangoOS());
function updateClock(){const d=new Date();const tf=String(getMangoPref('timeFormat','24'));$('#clock-time').textContent=d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',hour12:tf==='12'});const df=String(getMangoPref('dateFormat','ja'));$('#clock-date').textContent=df==='ja-long'?d.toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric'}):df==='en'?d.toLocaleDateString('en-US',{year:'numeric',month:'2-digit',day:'2-digit'}):d.toLocaleDateString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit'}); }
function renderCalendar(){const now=new Date(),y=now.getFullYear(),m=now.getMonth(),weekStart=Number(getMangoPref('weekStart','0'))||0;$('#calendar-month').textContent=now.toLocaleDateString('ja-JP',{year:'numeric',month:'long'});$('#calendar-full-date').textContent=now.toLocaleDateString('ja-JP',{weekday:'long',month:'long',day:'numeric'});const first=(new Date(y,m,1).getDay()-weekStart+7)%7,days=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate(),weekdays=['日','月','火','水','木','金','土'];const ordered=weekdays.slice(weekStart).concat(weekdays.slice(0,weekStart));let html=ordered.map(x=>`<span class="weekday">${x}</span>`).join('');for(let i=0;i<42;i++){let day=i-first+1,cls='',n=day;if(day<1){n=prev+day;cls='dim'}else if(day>days){n=day-days;cls='dim'}else if(day===now.getDate())cls='today';html+=`<span class="${cls}">${n}</span>`}$('#calendar-grid').innerHTML=html}
// Keep browser/OS exit shortcuts from being interpreted as MangoOS actions.
// Normal gameplay keys (WASD, arrows, Space, etc.) continue to reach HTML apps.
const blockedBrowserCombos=new Set(['w','q','r','t','n','l','f','p','j','tab']);
function isTextEntry(target){return !!(target&&target.closest&&target.closest('input,textarea,select,[contenteditable="true"]'))}
function shouldBlockSystemKey(e,insideFrame=false){
 const k=String(e.key||'').toLowerCase();
 if(k==='escape'||k==='meta'||k==='os'||k==='f5'||/^f([1-9]|1[0-2])$/.test(k)||k==='browserback'||k==='browserforward'||k==='backspace'&&!isTextEntry(e.target))return true;
 if(e.altKey&&k==='f4')return true;
 if((e.ctrlKey||e.metaKey)&&blockedBrowserCombos.has(k))return true;
 if((e.ctrlKey||e.metaKey)&&e.shiftKey&&['w','q','t','i','j','c','m','d','delete'].includes(k))return true;
 if((e.ctrlKey||e.metaKey)&&['+','=','-','0'].includes(k))return true;
 if((e.ctrlKey||e.metaKey||e.altKey)&&!isTextEntry(e.target))return true;
 return false;
}
function guardKeyEvent(e,insideFrame=false,isMangoBattle=false){
 if(e.key==='F11'){
  e.preventDefault();e.stopPropagation();e.stopImmediatePropagation?.();
  if(!e.repeat&&!mangoShutdown)toggleMangoFullscreenFromKey();
  return;
 }
 // MangoBattle owns Escape while its Creative pause sidebar is active.
 if(e.key==='Escape'&&insideFrame&&isMangoBattle)return;
 if(!insideFrame&&(e.key==='Meta'||e.key==='OS')){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation?.();if(!e.repeat&&!mangoShutdown){togglePanel('start-panel');if($('#start-panel').classList.contains('open'))renderStart()}return}
 if(shouldBlockSystemKey(e,insideFrame)){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation?.();}
}
// F11 is a MangoOS workspace command: app windows fill the MangoOS viewport and the OS taskbar hides.
function toggleMangoFullscreenFromKey(){
 hidePanels();
 const rec=activeWindow?windows.get(activeWindow):null;
 if(rec&&rec.el&&!rec.el.classList.contains('minimized')){
  const entering=!rec.el.classList.contains('mango-os-fullscreen');
  rec.el.classList.toggle('mango-os-fullscreen',entering);
  document.body.classList.toggle('mango-os-app-fullscreen',entering);
  if(entering){document.body.classList.remove('mango-os-desktop-fullscreen');rec.prevF11={left:rec.el.style.left,top:rec.el.style.top,width:rec.el.style.width,height:rec.el.style.height};rec.el.style.zIndex='40000';}
  else{if(rec.prevF11){rec.el.style.left=rec.prevF11.left;rec.el.style.top=rec.prevF11.top;rec.el.style.width=rec.prevF11.width;rec.el.style.height=rec.prevF11.height;rec.prevF11=null;}rec.el.style.zIndex=String(++nextZ);focusWindow(rec.el);}
  return;
 }
 const entering=document.body.classList.toggle('mango-os-desktop-fullscreen');
 toast('MangoOS 表示モード',entering?'デスクトップ領域を拡大しました。F11で元に戻せます。':'通常のデスクトップ表示に戻しました。');
}
function installFrameKeyGuard(frame){
 const d=frame.contentDocument;if(!d||d.__mangoKeyGuard)return;d.__mangoKeyGuard=true;
 const isMangoBattle=!!d.querySelector('meta[name="mangoos-app"][content="mangobattle"]');
 d.addEventListener('contextmenu',e=>e.preventDefault(),true);
 d.addEventListener('keydown',e=>guardKeyEvent(e,true,isMangoBattle),true);
 d.addEventListener('keyup',e=>{if(e.key==='Escape'&&isMangoBattle)return;if(['Escape','F11','Meta','OS'].includes(e.key)){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation?.()}},true);
 // Forward a real tap in an embedded HTML app to the top-level OS fullscreen handler.
 d.addEventListener('pointerdown',()=>requestBrowserFullscreenFromGesture(),{capture:true,once:true});
}
document.addEventListener('keydown',e=>guardKeyEvent(e,false),true);
document.addEventListener('keyup',e=>{if(['Escape','F11','Meta','OS'].includes(e.key)){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation?.()}},true);
// The browser controls tab/window closing. This is only a final warning, not a hard lock.
let mangoShutdown=false;
window.addEventListener('beforeunload',e=>{if(!mangoShutdown){e.preventDefault();e.returnValue=''}});

// Ask for browser fullscreen on the first real click/tap anywhere in MangoOS.
// This is separate from F11, which stays an internal MangoOS window command.
let mangoBrowserFullscreenRequested=false;
function requestBrowserFullscreenFromGesture(){
 if(document.fullscreenElement||mangoBrowserFullscreenRequested)return;
 try{
  const request=document.documentElement.requestFullscreen({navigationUI:'hide'});
  mangoBrowserFullscreenRequested=true;
  Promise.resolve(request).then(()=>{if(navigator.keyboard&&typeof navigator.keyboard.lock==='function')return navigator.keyboard.lock(['Escape','F11']).catch(err=>console.warn('Keyboard lock unavailable',err));}).catch(err=>{mangoBrowserFullscreenRequested=false;console.warn('Fullscreen request failed',err);});
 }catch(err){mangoBrowserFullscreenRequested=false;console.warn('Fullscreen request failed',err);}
}
document.addEventListener('pointerdown',()=>requestBrowserFullscreenFromGesture(),{capture:true});
document.addEventListener('fullscreenchange',()=>{mangoBrowserFullscreenRequested=!!document.fullscreenElement;if(document.fullscreenElement&&navigator.keyboard&&typeof navigator.keyboard.lock==='function')navigator.keyboard.lock(['Escape','F11']).catch(err=>console.warn('Keyboard lock unavailable',err));else if(!document.fullscreenElement){try{navigator.keyboard?.unlock?.()}catch{}}});
window.addEventListener('message',event=>{
 if(event.origin!==location.origin||!event.data)return;
 if(event.data.type==='MANGOOS_USER_GESTURE_FULLSCREEN')requestBrowserFullscreenFromGesture();
 if(event.data.type==='MANGOOS_CLOSE_ACTIVE_APP'){const id=activeWindow;if(id)closeWindow(id);}
});

async function init(){mangoShutdown=false;try{db=await openDB();apps=await dbAll()}catch(err){console.warn('IndexedDB unavailable',err);toast('保存機能','このブラウザーではアプリ保存が利用できない場合があります。')}makeDesktopItems();if(isPerformanceInstalled()&&(storage.getItem('mango-performance-overlay')==='1'||getMangoPref('startupPerformance',false))){perfState.overlay=true;ensurePerformanceOverlay().classList.add('show');startPerfSampler()}if(getMangoPref('startupStore',false))setTimeout(()=>{if(!mangoShutdown)openStore()},1200);const theme=storage.getItem('mango-theme');if(theme)setTheme(theme);const accent=storage.getItem('mango-accent');if(accent)document.documentElement.style.setProperty('--accent',accent);applyAllMangoPreferences();updateClock();setInterval(updateClock,1000);updateBackgroundTray();setTimeout(()=>$('#boot').classList.add('hide'),950)}
init();
})();
